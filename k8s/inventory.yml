all:
  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            k8s-master:
              ansible_user: ansible
              ansible_ssh_private_key_file: ./ssh-key
              ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
              ansible_host: "{{ hostvars['localhost']['master_ip'] }}"
        workers:
          hosts:
            k8s-worker-1:
              ansible_user: ansible
              ansible_ssh_private_key_file: ./ssh-key
              ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
              ansible_host: "{{ hostvars['localhost']['worker1_ip'] }}"
            k8s-worker-2:
              ansible_user: ansible
              ansible_ssh_private_key_file: ./ssh-key
              ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
              ansible_host: "{{ hostvars['localhost']['worker2_ip'] }}"
      vars:
        ansible_user: ansible
        ansible_ssh_private_key_file: ./ssh-key
        ansible_python_interpreter: /usr/bin/python3
